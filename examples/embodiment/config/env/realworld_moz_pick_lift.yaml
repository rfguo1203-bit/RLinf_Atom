# Fixed-tabletop right-arm pick-and-lift environment for MOZ.
#
# Camera ordering is stable for CNN policies: ``head_rgb`` is the main view
# and ``right_wrist_rgb`` is the single extra view. Hardware ownership lives
# under ``cluster.node_groups[].hardware``; do not place SDK or calibration
# fields in ``override_cfg``.
env_type: real
total_num_envs: null

auto_reset: true
ignore_terminations: false
reward_mode: raw
wrap_obs_mode: simple
seed: 0
group_size: 1
use_fixed_reset_state_ids: false
max_steps_per_rollout_epoch: 150
max_episode_steps: 150
keyboard_reward_wrapper: eval_control
teleop: none
main_image_key: head_rgb

video_cfg:
  save_video: false
  info_on_video: true
  video_base_dir: ${runner.logger.log_path}/video/train

init_params:
  id: MozPickLift-v0
  num_envs: null
