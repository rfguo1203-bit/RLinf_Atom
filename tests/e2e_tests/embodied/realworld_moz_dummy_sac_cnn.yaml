# Controller-independent MOZ RLPD smoke test. The physical SDK is never imported.
defaults:
  - env/realworld_moz_pick_lift@env.train
  - env/realworld_moz_pick_lift@env.eval
  - model/cnn_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    actor,rollout: 0
    env:
      node_group: moz
      placement: 0
  node_groups:
    - label: moz
      node_ranks: 0
      hardware:
        type: MOZ
        configs:
          - node_rank: 0
            disable_validate: true
            realsense_serials: head,left_wrist,right_wrist

runner:
  task_type: embodied
  logger:
    log_path: /workspace/results/realworld_moz_dummy_sac_cnn
    project_name: rlinf
    experiment_name: ci-test
    logger_backends: [tensorboard]
  max_epochs: 2
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: -1

algorithm:
  update_epoch: 32
  group_size: 1
  agg_q: min
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: token-mean
  bootstrap_type: always
  gamma: 0.8
  tau: 0.01
  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 0.01
    target_entropy: -7
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0
  replay_buffer:
    enable_cache: true
    cache_size: 100
    sample_window_size: 100
    min_buffer_size: 0
    auto_save: false
  target_update_freq: 1

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 1
    total_num_envs: 1
    auto_reset: true
    ignore_terminations: true
    use_fixed_reset_state_ids: false
    override_cfg:
      is_dummy: true
      max_num_steps: 5
  eval:
    rollout_epoch: 1
    total_num_envs: 1
    override_cfg:
      is_dummy: true
      max_num_steps: 5

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  model:
    precision: ${actor.model.precision}
    model_path: /workspace/dataset/resnet
    state_dim: 14
    action_dim: 7
    image_num: 2
  enable_torch_compile: true
  enable_cuda_graph: false

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 256
  global_batch_size: 256
  seed: 1234
  enable_offload: false
  model:
    model_path: /workspace/dataset/resnet
    state_dim: 14
    action_dim: 7
    image_num: 2
  optim:
    clip_grad: 10.0
    lr: 3.0e-4
    lr_scheduler: torch_constant
  critic_optim:
    clip_grad: 10.0
    lr: 3.0e-4
    lr_scheduler: torch_constant
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
